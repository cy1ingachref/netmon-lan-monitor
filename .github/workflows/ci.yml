name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scapy (primary capture/dissection backend)
        run: python -m pip install --upgrade pip scapy
      - name: Run tests
        run: python -m pytest netmon/tests -ra
